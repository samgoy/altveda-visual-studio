name: Render AltVeda Video

on:
  workflow_dispatch:
    inputs:
      template:
        description: "Template type (founder-story, product-showcase, social-short, tv-commercial)"
        required: true
        default: "product-showcase"
      product_id:
        description: "WooCommerce product ID (optional, for product-showcase)"
        required: false
      duration:
        description: "Duration in seconds"
        required: false
        default: "30"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Render video
        env:
          WOOCOMMERCE_URL: ${{ secrets.WOOCOMMERCE_URL }}
          WOOCOMMERCE_KEY: ${{ secrets.WOOCOMMERCE_KEY }}
          WOOCOMMERCE_SECRET: ${{ secrets.WOOCOMMERCE_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npx tsx scripts/render.ts \
            --template ${{ github.event.inputs.template }} \
            --duration ${{ github.event.inputs.duration }} \
            --product-id ${{ github.event.inputs.product_id || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output/*.mp4
          retention-days: 30

      - name: Deploy to Cloudflare Pages
        if: success()
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: altveda-videos
          directory: output