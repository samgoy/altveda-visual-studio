name: Render AltVeda Video

on:
  workflow_dispatch:
    inputs:
      template:
        description: "Template type (founder-story, product-showcase, social-short, tv-commercial)"
        required: true
        default: "product-showcase"
      duration:
        description: "Duration in seconds"
        required: false
        default: "30"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm ci
          npm install -g @remotion/cli ffmpeg

      - name: Render video
        env:
          WOOCOMMERCE_URL: ${{ secrets.WOOCOMMERCE_URL }}
          WOOCOMMERCE_KEY: ${{ secrets.WOOCOMMERCE_KEY }}
          WOOCOMMERCE_SECRET: ${{ secrets.WOOCOMMERCE_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npx tsx scripts/render.ts \
            --template ${{ github.event.inputs.template }} \
            --duration ${{ github.event.inputs.duration }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output/*.mp4
          retention-days: 30